name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check mod.json version matches tag
        if: github.event_name == 'release'
        run: |
          VERSION=$(node -p "require('./mod.json').version")
          if [ "v$VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::mod.json version ($VERSION) does not match tag (${{ github.event.release.tag_name }})"
            exit 1
          fi

      - name: Pack installable zip
        run: |
          mkdir -p dist
          zip -j "dist/folia-lx-source-bridge-${{ github.event.release.tag_name || 'snapshot' }}.zip" \
            mod.json index.cjs client.mjs README.md preview.png

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber

      - name: Upload build artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: folia-lx-source-bridge
          path: dist/*.zip
